<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5d43bd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ひきざん れんしゅう</title>
  <style>
    :root {
      color-scheme: light;
      --purple: #6447c6;
      --purple-dark: #462e98;
      --purple-pale: #f1ebff;
      --ink: #25233a;
      --muted: #686680;
      --line: #ded9ee;
      --page: #f6f3ff;
      --card: #ffffff;
      --green: #13865b;
      --red: #c34562;
      --shadow: 0 14px 36px rgba(70, 46, 152, .11);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      background: radial-gradient(circle at 10% 0%, #e9e1ff 0, transparent 32%), radial-gradient(circle at 100% 100%, #e1f8fa 0, transparent 30%), var(--page);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    button { font: inherit; touch-action: manipulation; cursor: pointer; }
    button:focus-visible { outline: 4px solid #2aa3bd; outline-offset: 3px; }
    button:disabled { cursor: default; opacity: .55; }
    .app {
      max-width: 1180px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display:flex; align-items:center; gap: 12px; }
    .brand-icon { flex: 0 0 auto; display:grid; place-items:center; width: 48px; height: 48px; border-radius: 15px; background: var(--purple); color:white; box-shadow: 0 6px 14px rgba(100,71,198,.2); font-size: 32px; font-weight: 900; }
    .brand h1 { font-size: clamp(20px, 2.6vw, 29px); margin:0; font-weight: 900; letter-spacing:.045em; }
    .brand small { display:block; color: var(--muted); font-size: 12px; font-weight:700; margin-top:3px; }
    .setting { display:flex; align-items:center; gap: 9px; padding: 7px 9px 7px 13px; border-radius: 19px; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 18px #514c7010; }
    .setting-label { color: #5b5875; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .switch { display: flex; background: #efeafc; border-radius: 12px; padding: 4px; gap: 3px; }
    .mode-btn { border:0; border-radius: 9px; padding: 10px 16px; min-height:44px; background:transparent; color: #635688; font-weight: 900; font-size:16px; }
    .mode-btn[aria-pressed="true"] { color: white; background: var(--purple); box-shadow: 0 3px 8px #5b40a841; }
    main { flex:1; display:flex; min-height:0; }
    .screen { width:100%; display:none; }
    .screen.active { display:flex; flex-direction:column; }
    .card { background: var(--card); border:1px solid #e9e4f5; border-radius: 27px; box-shadow: var(--shadow); }
    .intro { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 22px; min-height: 390px; position:relative; overflow:hidden; }
    .intro::before, .intro::after { content:"−"; position:absolute; font-weight:900; color:#e7ddff; pointer-events:none; line-height:1; }
    .intro::before { font-size:190px; transform:rotate(-20deg); top:-50px; left:-20px; }
    .intro::after { font-size:160px; transform:rotate(22deg); bottom:-50px; right:-10px; }
    .hero { width: 106px; height:106px; border-radius:32px; background:var(--purple-pale); color:var(--purple); display:grid; place-items:center; font-size:78px; font-weight:900; line-height:1; margin-bottom: 14px; }
    .intro h2 { z-index:1; font-size:clamp(25px, 4vw, 39px); margin:10px 0; letter-spacing:.04em; }
    .intro p { z-index:1; font-size:clamp(15px, 2.2vw, 20px); color:var(--muted); line-height:1.65; margin:4px 0 22px; font-weight:700; }
    .primary { border:0; background:var(--purple); color:white; font-weight:900; border-radius:18px; padding: 17px 32px; min-height: 60px; font-size:clamp(19px, 2.4vw, 24px); box-shadow: 0 8px 16px #6447c63b; }
    .primary:active { transform: translateY(2px); }
    .secondary { border:2px solid #dfd6f4; background:white; color:var(--purple-dark); font-weight:900; border-radius:16px; min-height:54px; padding:12px 23px; font-size:18px; }
    .mini-stats { z-index:1; background:#f6f3fe; margin-top:22px; border-radius:15px; padding:11px 18px; font-size:14px; font-weight:700; color:#565079; }
    .game-head { background:white; border:1px solid #e9e4f5; padding:14px 18px; border-radius:19px; display:flex; align-items:center; gap:16px; box-shadow: 0 4px 12px #4f327210; }
    .problem-count { min-width:118px; font-size:17px; font-weight:900; color:var(--purple-dark); }
    .progress { flex:1; height:13px; background:#ede8fa; border-radius:20px; overflow:hidden; }
    .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#a78dff,var(--purple)); border-radius:20px; transition:width .25s; }
    .game-grid { flex:1; min-height:0; display:grid; grid-template-columns: minmax(0,1.15fr) minmax(300px,.85fr); gap:15px; margin-top:15px; }
    .question-panel { display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:24px 20px; min-width:0; min-height:0; }
    .question-hint { font-size:17px; color:var(--muted); font-weight:800; }
    .equation { display:flex; flex-wrap:nowrap; justify-content:center; align-items:center; gap:clamp(7px, 1.5vw, 17px); white-space:nowrap; width:100%; margin: 18px 0; font-size:clamp(48px, 6.8vw, 94px); font-weight:900; line-height:1.25; font-variant-numeric:tabular-nums; }
    .minus { color:var(--purple); }
    .equal { color:#9890b9; }
    .answer-space { min-width: 1.2em; min-height:1.16em; color:var(--purple); display:inline-flex; justify-content:center; align-items:center; border-bottom: 6px solid #b49bec; font-size:.95em; }
    .answer-space.empty { color:#c2b6e1; }
    .feedback { display:grid; place-items:center; text-align:center; min-height: 67px; color:var(--muted); font-weight:850; font-size:clamp(17px, 2vw, 23px); line-height:1.5; }
    .feedback.correct { color:var(--green); }
    .feedback.wrong { color:var(--red); }
    .keypad-panel { display:flex; flex-direction:column; min-height:0; padding:16px; gap:12px; }
    .keypad-title { color:var(--muted); font-size:15px; font-weight:850; text-align:center; }
    .keypad { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(54px,1fr)); gap:9px; }
    .digit { border:2px solid #e7defa; border-radius:15px; background:#f6f2ff; color:var(--purple-dark); font-size:clamp(25px, 3vw, 37px); font-weight:900; min-height:54px; }
    .digit:active { background:#e2d5ff; transform:scale(.975); }
    .tool { border:2px solid #e0e5ef; border-radius:15px; background:#f5f7fb; color:#5b5873; font-size:clamp(13px,1.6vw,17px); font-weight:900; min-height:54px; }
    .tool:active { background:#e4eaf4; }
    .action { min-height:60px; border:0; border-radius:16px; background:var(--purple); color:white; font-weight:900; font-size:clamp(18px, 2.2vw, 23px); box-shadow:0 7px 13px #6447c638; }
    .action:active { transform:translateY(1px); }
    .action.next { background:var(--green); box-shadow:0 7px 13px #13865b24; }
    .result { flex:1; padding:24px; display:flex; flex-direction:column; gap:13px; align-items:center; text-align:center; }
    .result h2 { font-size:clamp(25px,4vw,35px); margin:3px 0; }
    .score { font-size:clamp(46px,8vw,76px); color:var(--purple); font-weight:950; font-variant-numeric:tabular-nums; line-height:1.1; }
    .score small { font-size:.36em; color:var(--muted); }
    .result-comment { font-size:19px; color:#55506f; font-weight:850; }
    .result-stats { display:flex; justify-content:center; flex-wrap:wrap; gap:9px; width:100%; }
    .stat { border-radius:13px; padding:10px 18px; background:#f4efff; min-width:140px; color:#4b3a8b; font-weight:800; }
    .stat b { display:block; font-size:24px; margin-top:4px; }
    details { width:min(100%,780px); text-align:left; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    summary { padding:12px 18px; cursor:pointer; font-weight:900; color:#53418e; background:#f9f7ff; }
    .review { width:100%; border-collapse:collapse; text-align:center; font-size:15px; }
    .review th, .review td { border-top:1px solid var(--line); padding:10px 7px; }
    .review th { background:#f6f3fd; font-weight:850; }
    .review .ok { color:var(--green); font-weight:900; }
    .review .ng { color:var(--red); font-weight:900; }
    .result-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
    .footer-note { margin:1px 0 0; text-align:center; color:#77708e; font-size:12px; font-weight:700; }
    /* iPad 縦向き: 問題を上・数字ボタンを下に配置して、一画面に収めやすくする */
    @media (orientation:portrait), (max-width:760px) {
      .game-grid { grid-template-columns:1fr; grid-template-rows:minmax(210px,.8fr) minmax(230px,1fr); }
      .question-panel { padding:16px; }
      .equation { font-size:clamp(45px, 9.4vw, 90px); margin:8px 0; }
      .keypad-panel { padding:12px; gap:8px; }
      .keypad { grid-template-columns:repeat(6,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(57px,1fr)); gap:7px; }
      .digit { font-size:clamp(25px,5vw,38px); }
      .action { min-height:54px; }
      .game-head { padding:11px 15px; }
      .keypad-title { font-size:14px; }
    }
    @media (max-width:600px) {
      .app { padding:10px; gap:10px; }
      .brand-icon { width:41px; height:41px; font-size:28px; border-radius:12px; }
      .setting { width:100%; justify-content:space-between; }
      .setting-label { font-size:12px; }
      .mode-btn { padding:8px 15px; }
      .card { border-radius:20px; }
      .game-grid { margin-top:10px; gap:10px; grid-template-rows:minmax(175px,.85fr) minmax(215px,1fr); }
      .equation { font-size:clamp(39px, 9.4vw, 60px); }
      .question-hint { font-size:14px; }
      .feedback { min-height:49px; font-size:16px; }
      .keypad { grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(48px,1fr)); }
      .keypad-panel { min-height:320px; }
      .digit,.tool { min-height:48px; }
      .intro { min-height:350px; }
    }
    @media (orientation:landscape) and (max-height:650px) and (min-width:761px) {
      .app { padding-top:8px; padding-bottom:8px; gap:8px; }
      .brand-icon { width:39px; height:39px; font-size:27px; }
      .brand h1 { font-size:21px; }
      .setting { padding:3px 7px 3px 10px; }
      .mode-btn { min-height:39px; padding:7px 12px; }
      .game-head { padding:9px 16px; }
      .game-grid { margin-top:8px; gap:10px; }
      .question-panel { padding:12px; }
      .equation { font-size:clamp(47px, 6.5vw, 85px); margin:8px 0; }
      .feedback { min-height:44px; }
      .keypad-panel { padding:10px; gap:7px; }
      .keypad { grid-template-rows:repeat(4,minmax(43px,1fr)); gap:6px; }
      .digit,.tool { min-height:43px; }
      .action { min-height:47px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; animation:none !important; } }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">−</div>
      <div><h1>ひきざん れんしゅう</h1><small>10もん チャレンジ！</small></div>
    </div>
    <div class="setting" aria-label="ひかれる かずの せってい">
      <span class="setting-label">ひかれる かず</span>
      <div class="switch" role="group" aria-label="ひかれる かずの さいだいち">
        <button type="button" class="mode-btn" data-limit="10" aria-pressed="true">10いか</button>
        <button type="button" class="mode-btn" data-limit="20" aria-pressed="false">20いか</button>
      </div>
    </div>
  </header>
  <main>
    <section id="intro" class="screen active" aria-labelledby="intro-heading">
      <div class="card intro">
        <div class="hero" aria-hidden="true">−</div>
        <h2 id="intro-heading">ひきざんを しよう！</h2>
        <p>すうじボタンで こたえよう。<br><span id="intro-mode">10いかの かず</span>から 10もん でるよ。</p>
        <button id="start" type="button" class="primary">スタート！</button>
        <div id="history-home" class="mini-stats" hidden></div>
      </div>
    </section>
    <section id="game" class="screen" aria-label="ひきざんの もんだい">
      <div class="game-head">
        <div id="counter" class="problem-count">もんだい 1 / 10</div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" aria-label="といた もんだいの かず">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <div class="game-grid">
        <div class="card question-panel">
          <div class="question-hint">のこりは いくつ？</div>
          <div class="equation" aria-live="polite" aria-atomic="true">
            <span id="minuend">9</span><span class="minus" aria-label="ひく">−</span><span id="subtrahend">3</span><span class="equal">=</span><span id="answer" class="answer-space empty">?</span>
          </div>
          <div id="feedback" class="feedback" role="status" aria-live="polite">こたえを いれてね</div>
        </div>
        <div class="card keypad-panel">
          <div class="keypad-title">すうじを おして こたえてね</div>
          <div id="keypad" class="keypad" aria-label="すうじボタン">
            <button class="digit" type="button" data-digit="7">7</button>
            <button class="digit" type="button" data-digit="8">8</button>
            <button class="digit" type="button" data-digit="9">9</button>
            <button class="digit" type="button" data-digit="4">4</button>
            <button class="digit" type="button" data-digit="5">5</button>
            <button class="digit" type="button" data-digit="6">6</button>
            <button class="digit" type="button" data-digit="1">1</button>
            <button class="digit" type="button" data-digit="2">2</button>
            <button class="digit" type="button" data-digit="3">3</button>
            <button class="tool" type="button" data-action="backspace">1もじ けす</button>
            <button class="digit" type="button" data-digit="0">0</button>
            <button class="tool" type="button" data-action="clear">ぜんぶ けす</button>
          </div>
          <button type="button" id="submit" class="action">ファイナルアンサー！</button>
        </div>
      </div>
    </section>
    <section id="result" class="screen" aria-labelledby="result-heading">
      <div class="card result">
        <h2 id="result-heading">けっか はっぴょう！</h2>
        <div id="score" class="score">0 <small>/ 10もん</small></div>
        <div id="result-comment" class="result-comment"></div>
        <div class="result-stats">
          <div class="stat">せいかいりつ<b id="accuracy">0%</b></div>
          <div class="stat">かかった じかん<b id="elapsed">0びょう</b></div>
          <div class="stat">いままでの ちょうせん<b id="games-played">1かい</b></div>
          <div class="stat">いままでの さいこう<b id="best">0 / 10</b></div>
        </div>
        <details>
          <summary>こたえあわせを みる</summary>
          <table class="review">
            <thead><tr><th>もんだい</th><th>あなたの こたえ</th><th>せいかい</th><th>けっか</th></tr></thead>
            <tbody id="review-body"></tbody>
          </table>
        </details>
        <div class="result-actions">
          <button id="again" type="button" class="primary">もう いちど！</button>
          <button id="finish" type="button" class="secondary">おわる</button>
        </div>
      </div>
    </section>
  </main>
  <div class="footer-note">むらさきいろの ひきざんアプリ　・　たて／よこの がめんに じどうたいおう</div>
</div>
<script>
(() => {
  'use strict';
  const TOTAL = 10;
  const STORAGE_KEY = 'hikizan-kids-v1-history';
  const $ = (id) => document.getElementById(id);
  const screens = ['intro','game','result'];
  let limit = 10;
  let phase = 'intro';
  let questions = [];
  let index = 0;
  let input = '';
  let answers = [];
  let startedAt = 0;
  let questionStartedAt = 0;
  let elapsedSeconds = 0;
  let soundContext = null;
  let memoryHistory = { games:0, best:0, totalCorrect:0, totalQuestions:0 };

  function safeHistory() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (data && Number.isFinite(data.games) && Number.isFinite(data.best) && Number.isFinite(data.totalCorrect) && Number.isFinite(data.totalQuestions)) return data;
    } catch (_) { /* File URL, private mode, or storage blocked */ }
    return memoryHistory;
  }
  function saveHistory(value) {
    memoryHistory = value;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); } catch (_) { /* still works in memory */ }
  }
  function show(screen) {
    phase = screen;
    screens.forEach(id => $(id).classList.toggle('active', id === screen));
  }
  function setLimit(newLimit) {
    if (newLimit === limit) return;
    if (phase === 'game' && answers.length) {
      const proceed = window.confirm('かずを きりかえると、いまの 10もんは さいしょからに なるよ。いい？');
      if (!proceed) return;
    }
    limit = newLimit;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.setAttribute('aria-pressed', String(Number(btn.dataset.limit) === limit)));
    $('intro-mode').textContent = limit + 'いかの かず';
    if (phase === 'game') startGame();
  }
  function shuffle(items) {
    const array = items.slice();
    for (let i=array.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [array[i],array[j]] = [array[j],array[i]];
    }
    return array;
  }
  function questionBank(max, minA=1) {
    const out = [];
    for(let a=minA; a<=max; a++) {
      for(let b=0; b<=a; b++) out.push({a,b,answer:a-b});
    }
    return out;
  }
  function makeQuestions() {
    if (limit === 10) return shuffle(questionBank(10)).slice(0,TOTAL);
    const all = questionBank(20);
    const borrowing = shuffle(all.filter(q => q.a>=11 && q.b>q.a%10 && q.b<=9));
    const otherLarge = shuffle(all.filter(q => q.a>=11 && !(q.b>q.a%10 && q.b<=9)));
    const small = shuffle(all.filter(q => q.a<=10));
    const selected = [...borrowing.slice(0,3),...otherLarge.slice(0,4),...small.slice(0,3)];
    return shuffle(selected);
  }
  function startGame() {
    questions = makeQuestions();
    answers = [];
    index = 0;
    startedAt = Date.now();
    show('game');
    renderQuestion();
  }
  function renderQuestion() {
    input = '';
    questionStartedAt = Date.now();
    const q = questions[index];
    $('minuend').textContent = q.a;
    $('subtrahend').textContent = q.b;
    $('counter').textContent = `もんだい ${index+1} / ${TOTAL}`;
    updateProgress(answers.length);
    $('feedback').textContent = 'こたえを いれてね';
    $('feedback').className = 'feedback';
    $('submit').textContent = 'ファイナルアンサー！';
    $('submit').classList.remove('next');
    document.querySelectorAll('#keypad button').forEach(btn => btn.disabled = false);
    renderInput();
  }
  function updateProgress(done) {
    $('progress-fill').style.width = `${done/TOTAL*100}%`;
    document.querySelector('.progress').setAttribute('aria-valuenow', String(done));
  }
  function renderInput() {
    $('answer').textContent = input || '?';
    $('answer').classList.toggle('empty', !input);
  }
  function typeDigit(digit) {
    if (phase !== 'game' || answers.length !== index || input.length >= 2) return;
    input = input === '0' ? digit : input + digit;
    renderInput();
    if ($('feedback').textContent === 'こたえを いれてね！') $('feedback').textContent = 'こたえを いれてね';
  }
  function backspace() {
    if (phase !== 'game' || answers.length !== index) return;
    input = input.slice(0,-1);
    renderInput();
  }
  function clearInput() {
    if (phase !== 'game' || answers.length !== index) return;
    input = '';
    renderInput();
  }
  function playSound(correct) {
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      if (!soundContext) soundContext = new Audio();
      if (soundContext.state === 'suspended') soundContext.resume().catch(()=>{});
      const now = soundContext.currentTime + .025;
      const tones = correct ? [523.25,659.25,783.99,1046.5] : [330,262];
      tones.forEach((freq,i) => {
        const oscillator = soundContext.createOscillator();
        const volume = soundContext.createGain();
        oscillator.type = correct ? 'sine' : 'triangle';
        oscillator.frequency.value = freq;
        const begin = now+i*(correct?.105:.19);
        const duration = correct?.22:.25;
        volume.gain.setValueAtTime(.0001,begin);
        volume.gain.exponentialRampToValueAtTime(correct?.12:.085,begin+.022);
        volume.gain.exponentialRampToValueAtTime(.0001,begin+duration);
        oscillator.connect(volume).connect(soundContext.destination);
        oscillator.start(begin);
        oscillator.stop(begin+duration+.01);
      });
    } catch (_) { /* Sound is optional */ }
  }
  function submitAnswer() {
    if (phase !== 'game') return;
    if (answers.length > index) { nextQuestion(); return; }
    if (!input) {
      $('feedback').textContent = 'こたえを いれてね！';
      return;
    }
    const q = questions[index];
    const userAnswer = Number(input);
    const correct = userAnswer === q.answer;
    const seconds = Math.round((Date.now()-questionStartedAt)/1000);
    answers.push({ ...q, userAnswer, correct, seconds });
    playSound(correct);
    $('feedback').className = 'feedback ' + (correct?'correct':'wrong');
    $('feedback').textContent = correct ? 'せいかい！ よくできたね！' : `ざんねん！ せいかいは ${q.answer} だよ`;
    $('submit').textContent = index === TOTAL-1 ? 'けっかを みる' : 'つぎの もんだいへ';
    $('submit').classList.add('next');
    document.querySelectorAll('#keypad button').forEach(btn => btn.disabled = true);
    updateProgress(answers.length);
  }
  function nextQuestion() {
    if (answers.length !== index+1) return;
    if (index === TOTAL-1) { finishGame(); return; }
    index++;
    renderQuestion();
  }
  function prettyTime(seconds) {
    const m = Math.floor(seconds/60), s=seconds%60;
    return m ? `${m}ふん ${s}びょう` : `${s}びょう`;
  }
  function finishGame() {
    elapsedSeconds = Math.round((Date.now()-startedAt)/1000);
    const correct = answers.filter(a=>a.correct).length;
    const prev = safeHistory();
    const history = { games:prev.games+1,best:Math.max(prev.best,correct),totalCorrect:prev.totalCorrect+correct,totalQuestions:prev.totalQuestions+TOTAL };
    saveHistory(history);
    $('score').innerHTML = `${correct} <small>/ 10もん</small>`;
    $('result-comment').textContent = correct===10?'ぜんもん せいかい！ すばらしい！':correct>=7?'よく がんばったね！':correct>=4?'あと すこし！ また やってみよう！':'こつこつ れんしゅう していこう！';
    $('accuracy').textContent = `${correct*10}%`;
    $('elapsed').textContent = prettyTime(elapsedSeconds);
    $('games-played').textContent = `${history.games}かい`;
    $('best').textContent = `${history.best} / 10`;
    $('review-body').replaceChildren();
    for (const q of answers) {
      const tr = document.createElement('tr');
      const values = [`${q.a} − ${q.b}`,String(q.userAnswer),String(q.answer),q.correct?'○':'×'];
      values.forEach((value,i)=>{
        const td = document.createElement('td');
        td.textContent=value;
        if (i===3) td.className=q.correct?'ok':'ng';
        tr.appendChild(td);
      });
      $('review-body').appendChild(tr);
    }
    document.querySelector('details').open = false;
    show('result');
  }
  function home() {
    show('intro');
    const history = safeHistory();
    $('history-home').hidden = history.games === 0;
    if (history.games) $('history-home').textContent = `これまで ${history.games}かい ちょうせん　・　さいこう ${history.best} / 10もん`;
  }
  document.querySelectorAll('.mode-btn').forEach(btn => btn.addEventListener('click',()=>setLimit(Number(btn.dataset.limit))));
  $('start').addEventListener('click',startGame);
  $('again').addEventListener('click',startGame);
  $('finish').addEventListener('click',home);
  $('keypad').addEventListener('click',event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (button.dataset.digit !== undefined) typeDigit(button.dataset.digit);
    if (button.dataset.action === 'backspace') backspace();
    if (button.dataset.action === 'clear') clearInput();
  });
  $('submit').addEventListener('click',submitAnswer);
  document.addEventListener('keydown',event=>{
    if (phase!=='game' || event.altKey || event.ctrlKey || event.metaKey) return;
    if (/^[0-9]$/.test(event.key)) { event.preventDefault(); typeDigit(event.key); }
    if (event.key==='Backspace') { event.preventDefault(); backspace(); }
    if (event.key==='Escape') { event.preventDefault(); clearInput(); }
    if (event.key==='Enter') { event.preventDefault(); submitAnswer(); }
  });
  home();
})();
</script>
</body>
</html>
